project:
  title: "Providing Adaptive knowledge for Ratcheting up the EU Biodiversity strategy for Sustainable landscapes and protected areas"
  acronym: PAREUS
  version: "1.0"
  status: Active

description:
  summary: >
    PAREUS will provide insight into consequences of land-use development and planning practice effectiveness for conservation-restoration prioritization, and visualizing pathways for integrated approaches for sustainable landscapes.

